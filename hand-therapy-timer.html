<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand therapy timer</title>
<style>
  :root{
    --bg:#edf1f3; --panel:#ffffff; --ink:#18262e; --muted:#5d6f79; --line:#d3dbe0;
    --hold:#0d7a69; --hold-soft:#d6efe9; --rest:#b8760a; --rest-soft:#fbeccd;
    --next:#3a5a73; --next-soft:#dde7ef; --top:132px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:17px/1.45 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
  button{font:inherit;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--hold);outline-offset:2px}

  /* ---- fixed control bar ---- */
  #bar{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
       box-shadow:0 2px 10px rgba(24,38,46,.08)}
  #bar .in{max-width:980px;margin:0 auto;padding:10px 20px;display:grid;
           grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
  #count{font-size:76px;font-weight:700;line-height:1;min-width:120px;text-align:center;
         font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--muted)}
  #count.hold,#count.go{color:var(--hold)} #count.rest{color:var(--rest)} #count.next{color:var(--next)}
  #phase{font-size:24px;font-weight:600;line-height:1.2}
  #sub{color:var(--muted);margin-top:4px}
  #segs{display:flex;gap:3px;margin-top:8px;height:8px}
  #segs i{flex:1;background:var(--line);border-radius:2px}
  #segs i.on{background:currentColor}
  #segs.hold,#segs.go{color:var(--hold)} #segs.rest{color:var(--rest)} #segs.next{color:var(--next)}
  .ctl{display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .ctl .row{display:flex;gap:8px}
  #go{background:var(--hold);color:#fff;border:0;border-radius:8px;padding:12px 26px;
      font-size:19px;font-weight:600;min-width:130px}
  #go.pause{background:var(--ink)}
  #reset{background:transparent;border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--muted)}
  select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  label.sm{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}

  /* ---- exercise list ---- */
  main{max-width:980px;margin:0 auto;padding:22px 20px 60vh}
  h1{font-size:22px;font-weight:600;margin:6px 0 2px}
  .lead{color:var(--muted);margin:0 0 20px}
  h2{font-size:15px;font-weight:600;color:var(--muted);margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  h2 span{font-weight:400}
  .ex{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;
      padding:16px 18px;margin:0 0 12px;display:grid;grid-template-columns:1fr auto;gap:18px;cursor:pointer;
      scroll-margin-top:calc(var(--top) + 14px);transition:border-color .2s,background .2s}
  .ex:hover{border-color:#b7c3ca;border-left-color:#b7c3ca}
  .ex.active{border-color:var(--hold);border-left-color:var(--hold);background:#f4fbf9}
  .ex.active.rest{background:#fffaf0;border-left-color:var(--rest)}
  .ex.done{opacity:.55}
  .ex.done .n{background:var(--hold);color:#fff}
  .ex h3{margin:0 0 6px;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
  .n{width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--ink);font-size:14px;font-weight:600;
     display:inline-flex;align-items:center;justify-content:center;flex:none}
  .ex p{margin:0 0 8px}
  .rx{color:var(--muted);font-size:15px}
  .rx b{color:var(--ink);font-weight:600}
  .pics{display:flex;gap:8px;align-items:flex-start}
  .pics img{height:150px;border-radius:6px;border:1px solid var(--line);background:#fff}
  .ex.active .pics img{height:210px}
  .reps{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .reps i{width:14px;height:14px;border-radius:3px;background:var(--line)}
  .reps i.done{background:var(--hold)} .reps i.cur{background:var(--rest)}
  .warn{background:var(--rest-soft);border-left:4px solid var(--rest);padding:10px 14px;border-radius:6px;margin:14px 0 0}
  @media (max-width:640px){
    #bar .in{grid-template-columns:auto 1fr;gap:12px} .ctl{grid-column:1/-1}
    #count{font-size:56px;min-width:80px} .ex{grid-template-columns:1fr}
    .pics img,.ex.active .pics img{height:130px}
  }
</style>
</head>
<body>

<div id="bar"><div class="in">
  <div id="count">—</div>
  <div>
    <div id="phase">Ready</div>
    <div id="sub">Pick a session and press Start. Space bar also starts and pauses.</div>
    <div id="segs"></div>
  </div>
  <div class="ctl">
    <div class="row">
      <button id="go">Start</button>
      <button id="reset" title="Back to the first exercise">Reset</button>
    </div>
    <select id="mode" aria-label="Session">
      <option value="all">Both, stretching first</option>
	  <option value="stretch">Stretching (3× a day)</option>
      <option value="strength">Strengthening (1× a day)</option>
    </select>
    <label class="sm"><input type="checkbox" id="snd" checked> Tick sound</label>
  </div>
</div></div>

<main>
  <h1>Hand therapy program</h1>
  <p class="lead">One count is one second. Click any exercise to jump the timer to it. Ten seconds between exercises, and a one-beat "Go" cue before every rep.</p>
  <div id="list"></div>
</main>

const BETWEEN = 5;

/* ---------------- build step list ---------------- */
let exercises = [], steps = [], pos = 0, left = 0, running = false, timer = null;

function buildProgram(){
  const m = document.getElementById('mode').value;
  exercises = m==='stretch'?STRETCH : m==='strength'?STRENGTH : [...STRETCH,...STRENGTH];
  steps = [];
  exercises.forEach((ex,ei)=>{
    if(ei>0) steps.push({ex:ei-1, nextEx:ei, kind:'next', secs:BETWEEN, label:'Next: '+ex.name, sub:'Get set for '+exercises[ei].name});
    for(let r=0;r<ex.reps;r++){
      const rl = ex.repLabel ? ex.repLabel(r) : (ex.gaps?'Count ':'Rep ')+(r+1)+' of '+ex.reps;
      if(ex.gaps){                                   /* one count = a pass through every gap */
        ex.gaps.forEach((g,gi)=>{
          const s = ex.name+' · '+rl+' · '+g;
          steps.push({ex:ei, rep:r, kind:'go', secs:1, label:'Go: '+g, sub:s});
          steps.push({ex:ei, rep:r, kind:'hold', secs:ex.hold, label:'Squeeze: '+g, sub:s});
          if(gi<ex.gaps.length-1) steps.push({ex:ei, rep:r, kind:'rest', secs:ex.gapRest-1, label:'Move to '+ex.gaps[gi+1], sub:s});
          else if(r<ex.reps-1) steps.push({ex:ei, rep:r, kind:'rest', secs:ex.rest-1, label:ex.restLabel, sub:s});
        });
        continue;
      }
      steps.push({ex:ei, rep:r, kind:'go', secs:1, label:'Go', sub:ex.name+' · '+rl});
      steps.push({ex:ei, rep:r, kind:'hold', secs:ex.hold, label:(ex.holdLabel||'Hold'), sub:ex.name+' · '+rl});
      if(r<ex.reps-1 || ex.restLabel)
        steps.push({ex:ei, rep:r, kind:'rest', secs:ex.rest, label:(ex.restLabel||'Rest'), sub:ex.name+' · '+rl});
    }
  });
  steps.push({ex:exercises.length-1, kind:'done', secs:0, label:'Session complete', sub:'Nice work.'});
  renderList(); goTo(0,false);
}

function renderList(){
  const list = document.getElementById('list'); list.innerHTML='';
  let lastSection='';
  exercises.forEach((ex,i)=>{
    const sec = STRETCH.includes(ex) ? 'Stretching <span>· three times a day</span>' : 'Strengthening <span>· once a day, green putty, never advance beyond pink</span>';
    if(sec!==lastSection){ const h=document.createElement('h2'); h.innerHTML=sec; list.appendChild(h); lastSection=sec; }
    const d=document.createElement('div'); d.className='ex'; d.id='ex'+i; d.tabIndex=0;
    d.setAttribute('role','button');
    const holdW = ex.holdLabel||'Hold';
    d.innerHTML = `<div>
        <h3><span class="n">${i+1}</span>${ex.name}</h3>
        <p>${ex.text}</p>
        <p class="rx">${ex.gaps? `Squeeze <b>${ex.hold}</b> per gap · <b>${ex.gaps.length}</b> gaps per count · <b>${ex.reps}</b> counts` : `${holdW} <b>${ex.hold}</b> · ${ex.restLabel||'rest'} <b>${ex.rest}</b> · <b>${ex.reps}</b> reps`}${ex.note?' · <i>'+ex.note+'</i>':''}</p>
        <div class="reps">${'<i></i>'.repeat(ex.reps)}</div>
      </div>
      <div class="pics">${ex.pics.map(p=>`<img src="${IMG[p]}" alt="${ex.name} cue photo">`).join('')}</div>`;
    const jump=()=>{ goTo(steps.findIndex(s=>s.ex===i&&s.kind==='go'), true); };
    d.addEventListener('click',jump);
    d.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();jump();} });
    list.appendChild(d);
  });
}

/* ---------------- timer ---------------- */
function goTo(i, scroll){
  pos = Math.max(0, Math.min(i, steps.length-1)); left = steps[pos].secs; paint(scroll);
}
function tick(){
  if(!running) return;
  left--;
  if(left<=0){
    if(pos>=steps.length-1){ running=false; setGo(); paint(true); return; }
    pos++; left=steps[pos].secs; chime(steps[pos]); paint(true);
    if(steps[pos].kind==='done'){ running=false; setGo(); }
  } else { click(); paint(false); }
}
function start(){ if(steps[pos].kind==='done') goTo(0,true); audio(); running=true; setGo(); if(timer) clearInterval(timer); timer=setInterval(tick,1000); chime(steps[pos]); paint(true); }
function pause(){ running=false; setGo(); if(timer){clearInterval(timer);timer=null;} paint(false); }
function setGo(){ const g=document.getElementById('go'); g.textContent=running?'Pause':'Start'; g.className=running?'pause':''; }

function paint(scroll){
  const s=steps[pos], c=document.getElementById('count'), ph=document.getElementById('phase'), sub=document.getElementById('sub'), segs=document.getElementById('segs');
  c.textContent = s.kind==='done'?'✓':left; c.className=s.kind;
  ph.textContent = s.label + (running||s.kind==='done'?'':'  (paused)');
  sub.textContent = s.sub;
  segs.className=s.kind; segs.innerHTML = s.secs? Array.from({length:s.secs},(_,k)=>`<i class="${k<s.secs-left?'on':''}"></i>`).join('') : '';
  const activeEx = s.kind==='next'? s.nextEx : s.ex;
  exercises.forEach((ex,i)=>{
    const d=document.getElementById('ex'+i); if(!d) return;
    d.className='ex'+(i===activeEx?' active':'')+(i<activeEx||s.kind==='done'?' done':'')+(s.kind==='rest'&&i===activeEx?' rest':'');
    d.querySelectorAll('.reps i').forEach((b,r)=>{
      const doneReps = i<activeEx||s.kind==='done'? ex.reps : (i===activeEx&&s.kind!=='next'? (s.rep+(s.kind==='rest'?1:0)) : 0);
      b.className = r<doneReps?'done':(i===activeEx&&(s.kind==='hold'||s.kind==='go')&&r===s.rep?'cur':'');
    });
  });
  if(scroll){ const d=document.getElementById('ex'+activeEx); if(d) d.scrollIntoView({block:'start'}); }
  document.title = (s.kind==='done'?'Done':left+'s · '+s.label)+' · Hand therapy';
}

/* ---------------- sound ---------------- */
let ac=null;
function audio(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); } if(ac.state==='suspended') ac.resume(); }
function beep(f,t,d,g=0.25){
  if(!document.getElementById('snd').checked||!ac) return;
  const o=ac.createOscillator(), v=ac.createGain(); o.type='square'; o.frequency.value=f;
  v.gain.setValueAtTime(g,ac.currentTime+t); v.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+d);
  o.connect(v).connect(ac.destination); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+d+0.02);
}
function click(){ beep(1000,0,0.035,0.18); }           /* metronome tick, once a second */
function chime(s){                                     /* phase change */
  if(s.kind==='hold') beep(660,0,0.12);
  else if(s.kind==='go') beep(880,0,0.08);
  else if(s.kind==='rest') beep(440,0,0.12);
  else if(s.kind==='next'){ beep(523,0,0.1); beep(784,0.14,0.18); }
  else if(s.kind==='done'){ beep(523,0,0.12); beep(659,0.15,0.12); beep(784,0.3,0.3); }
}

/* ---------------- wiring ---------------- */
document.getElementById('go').addEventListener('click',()=>running?pause():start());
document.getElementById('reset').addEventListener('click',()=>{ pause(); goTo(0,true); });
document.getElementById('mode').addEventListener('change',()=>{ pause(); buildProgram(); });
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && !['SELECT','INPUT','BUTTON'].includes(e.target.tagName)){ e.preventDefault(); running?pause():start(); }
});
buildProgram();
</script>
